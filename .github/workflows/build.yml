name: Build

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # compiles for Java 11, and runs the offline tests (the ones that need no api key)
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean package
