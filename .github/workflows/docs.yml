name: Docs

# Builds the javadoc of a release and publishes it with GitHub Pages.
#
# One-time setup by the owner of the repository: Settings > Pages > Source: "GitHub Actions".
# The docs are then available at https://<owner>.github.io/<repository>/
on:
  push:
    tags: [ '*' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  javadoc:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build the javadoc
        run: mvn --batch-mode --no-transfer-progress javadoc:javadoc

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/apidocs

      - id: deploy
        uses: actions/deploy-pages@v4
