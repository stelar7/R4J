name: Docs

# Builds the javadoc and publishes it with GitHub Pages, at https://stelar7.github.io/R4J/
#
# It runs when master changes, so the docs always describe the current code (which is also what a release is tagged from).
# It does not run on tags: the github-pages environment of this repository only accepts deployments from the master branch,
# so a run started by a tag would be refused. To publish per release instead, allow tags in
# Settings > Environments > github-pages > Deployment branches and tags, and change the trigger below to tags.
on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  javadoc:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build the javadoc
        run: mvn --batch-mode --no-transfer-progress javadoc:javadoc

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/apidocs

      - id: deploy
        uses: actions/deploy-pages@v4
