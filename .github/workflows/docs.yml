name: Docs

# Builds the javadoc of a release and publishes it with GitHub Pages, at https://stelar7.github.io/R4J/
#
# It runs when a tag is pushed, so the published docs describe the latest release.
# It can also be started by hand from the Actions tab, for example to publish the docs before the first tag.
# The github-pages environment has to allow deployments from tags (Settings > Environments > github-pages: no restriction).
on:
  push:
    tags: [ '*' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  javadoc:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build the javadoc
        run: mvn --batch-mode --no-transfer-progress javadoc:javadoc

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/apidocs

      - id: deploy
        uses: actions/deploy-pages@v4
